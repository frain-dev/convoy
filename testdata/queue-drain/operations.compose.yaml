services:
  redis:
    image: redis:7-alpine
    command:
      - sh
      - -c
      - "test -f /data/users.acl || printf 'user default on nopass ~* &* +@all\n' > /data/users.acl; exec redis-server --appendonly yes --appendfsync always --aclfile /data/users.acl"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -qE 'PONG|NOAUTH'"]
      interval: 1s
      timeout: 3s
      retries: 30
  postgres:
    image: postgres:15.2-alpine
    environment:
      POSTGRES_USER: qa
      POSTGRES_PASSWORD: qa
      POSTGRES_DB: queue_operations
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa -d queue_operations"]
      interval: 1s
      timeout: 3s
      retries: 30
  qa:
    image: alpine:3.21
    entrypoint: ["/tests/queue-drain.test"]
    read_only: true
    tmpfs: ["/tmp"]
    environment:
      QUEUE_OPERATION_DOCKER_QA: "1"
    volumes:
      - ${QUEUE_DRAIN_TEST_BINARY:?Build the test binary first}:/tests/queue-drain.test:ro
      - ../../sql:/sql:ro
