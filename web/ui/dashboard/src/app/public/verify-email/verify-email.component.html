<convoy-auth-shell>
	<div authCard class="flex flex-col gap-24px py-8px">
		@if (loading) {
			<p class="font-body font-normal text-[20px] leading-[24px] text-new.text-secondary">Verifying your email…</p>
			<img src="/assets/img/page-loader.gif" alt="Loading" class="h-48px self-start" />
		} @else if (!showError) {
			<p class="font-body font-normal text-[20px] leading-[24px] text-new.text-secondary">Your email has been verified!</p>
			<button
				type="button"
				class="w-full px-16px py-12px rounded-full bg-new.primary-400 font-body font-medium text-[14px] leading-[16px] text-white-100 transition-all hover:opacity-90"
				routerLink="/"
				>
				Done
			</button>
		} @else {
			<p class="font-body font-normal text-[20px] leading-[24px] text-new.text-secondary">Your email verification failed</p>
			@if (token) {
				<button
					type="button"
					class="w-full px-16px py-12px rounded-full bg-new.primary-400 font-body font-medium text-[14px] leading-[16px] text-white-100 transition-all hover:opacity-90 disabled:opacity-50"
					[disabled]="isResendingEmail"
					(click)="resendVerificationEmail()"
					>
					{{ isResendingEmail ? 'Sending...' : 'Resend Email' }}
				</button>
			}
			<button
				type="button"
				class="w-full px-16px py-12px rounded-full bg-new.surface-muted font-body font-medium text-[14px] leading-[16px] text-new.text-primary transition-all hover:opacity-80"
				routerLink="/login"
				>
				Back to login
			</button>
		}
	</div>
</convoy-auth-shell>
