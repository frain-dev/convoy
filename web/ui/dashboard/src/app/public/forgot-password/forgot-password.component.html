<convoy-auth-shell
	[heading]="activeState === 'resetPassword' ? 'Forgot your password?' : 'Check your email'"
	[subheading]="activeState === 'resetPassword' ? 'Enter your email to get a reset link' : 'We sent a password reset link to your email'"
	>
	<div authCard>
		@if (activeState === 'resetPassword') {
			<form [formGroup]="forgotPasswordForm" (ngSubmit)="resetPassword()" class="flex flex-col gap-16px">
				<div>
					<label for="email" class="auth-label">Email address</label>
					<input type="email" id="email" class="auth-input" autocomplete="email" formControlName="email" placeholder="name@default.com" />
					@if (forgotPasswordForm.get('email')?.touched && forgotPasswordForm.get('email')?.invalid) {
						<convoy-input-error>Please enter a valid email</convoy-input-error>
					}
				</div>

				<button
					type="submit"
					class="w-full px-16px py-12px rounded-full bg-new.primary-400 font-body font-medium text-[14px] leading-[16px] text-white-100 text-center transition-all hover:opacity-90 disabled:opacity-50"
					[disabled]="loading"
					>
					{{ loading ? 'Sending...' : 'Send reset link' }}
				</button>
			</form>
		} @else {
			<div class="flex flex-col items-center gap-16px text-center">
				<img src="/assets/img/svg/inbox-verify.svg" class="w-48px h-48px" alt="" />
				<p class="font-body font-normal text-[14px] leading-normal text-new.text-secondary">
					Follow the link we sent to
					<span class="font-medium text-new.text-primary">{{ forgotPasswordForm.value.email }}</span>
					to reset your password.
				</p>
				<button
					type="button"
					class="min-w-[140px] px-16px py-12px rounded-full bg-new.surface-muted font-body font-medium text-[14px] leading-[16px] text-new.text-primary text-center transition-all hover:opacity-80 disabled:opacity-50"
					[disabled]="loading"
					(click)="resetPassword()"
					>
					{{ loading ? 'Resending...' : 'Resend link' }}
				</button>
			</div>
		}
	</div>

	<div authFooter class="flex flex-col gap-8px w-full">
		<div class="bg-new.surface-page border border-new.border rounded-12px p-16px flex items-center justify-between w-full">
			<span class="font-heading font-medium text-[14px] text-new.text-secondary">Remembered your password?</span>
			<button type="button" class="flex items-center gap-8px font-body font-medium text-[14px] text-new.text-primary" (click)="router.navigateByUrl('/login')">
				Back to login
				<span class="w-24px h-24px flex items-center justify-center">
					<img src="/assets/img/svg/chevron-right.svg" class="w-6px h-10px" alt="" />
				</span>
			</button>
		</div>
	</div>
</convoy-auth-shell>
