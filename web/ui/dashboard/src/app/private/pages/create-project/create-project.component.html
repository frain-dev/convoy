<dialog #projectDialog convoy-dialog id="projectForm" position="full" escapeAction="delegate" (escaped)="cancel()" class="!bg-new.surface-page">
	<div class="sticky top-0 z-10 flex items-center justify-between gap-16px px-24px h-60px border-b border-new.border bg-white-100">
		<h2 class="font-heading font-medium text-[16px] leading-[24px] text-new.text-primary">Create Project</h2>
		<button type="button" class="w-28px h-28px flex items-center justify-center rounded-full bg-new.surface-muted transition-opacity hover:opacity-80" (click)="cancel()" aria-label="Close">
			<img src="/assets/img/close-icon.svg" class="w-12px h-12px" alt="" />
		</button>
	</div>

	<div class="h-full w-full">
		<div class="pt-40px pb-60px max-w-[770px] m-auto desktop:px-24px">
			<p class="font-body font-normal text-[14px] leading-normal text-new.text-secondary mb-24px max-w-[500px]">A project represents the top level namespace for grouping event sources, applications, endpoints and events.</p>

			<app-create-project-component (onAction)="$event?.action == 'cancel' ? cancel() : createProject($event)"></app-create-project-component>
		</div>
	</div>
</dialog>
