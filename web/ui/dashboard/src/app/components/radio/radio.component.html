<div class="relative h-full">
  <input #radioInput type="radio" [id]="id" [name]="name" [formControl]="control" [value]="value" [checked]="checked" class="peer opacity-0 absolute" />
  <label [for]="id" class="bg-white-100 border border-new.border rounded-12px p-16px block transition-all duration-200 peer-checked:border-new.primary-400 peer-checked:bg-new.primary-25 h-full cursor-pointer">
    <div class="flex justify-between">
      <div class="flex items-start">
        <div class="w-16px"></div>
        <div class="ml-20px">
          <p class="font-heading font-medium text-[13px] leading-[18px] text-new.text-primary">{{ label }}</p>
          @if (description) {
            <p class="font-body font-normal text-[12px] leading-normal text-new.text-secondary text-left mt-2px">{{ description }}</p>
          }
        </div>
      </div>
      @if (tooltipContent) {
        <convoy-tooltip [position]="tooltipPosition" [size]="tooltipSize">
          {{ tooltipContent }}
        </convoy-tooltip>
      }
    </div>
  </label>
  <div class="absolute top-20px left-[17px] rounded-[50px] mb-0 border border-new.border w-16px h-16px transition-all duration-200 peer-checked:border-new.primary-400 peer-checked:border-[5px]" (click)="radioInput.click()"></div>
</div>
