@if (!file) {
  <div (click)="file.click()" class="border border-dashed border-new.border rounded-12px flex flex-col justify-center items-center h-140px hover:cursor-pointer hover:bg-new.surface-subtle transition-colors">
    <img src="/assets/img/download.png" class="mb-12px" alt="download icon" />
    <ng-content></ng-content>
    <input #file type="file" class="invisible h-0" (change)="parseFile($event)" />
  </div>
}
@if (file) {
  <div class="border border-new.border rounded-12px flex items-center p-18px relative group hover:border-new.primary-400 transition-colors">
    <img src="/assets/img/file.png" class="shrink-0" alt="download icon" />
    <div class="flex flex-col ml-10px flex-1 min-w-0">
      <p class="font-body font-medium text-[12px] text-new.text-primary truncate">{{ file.name }}</p>
      <p class="font-body font-normal text-[10px] text-new.text-secondary">{{ fileSize(file.size) }}</p>
    </div>
    <!-- Always-visible remove control so keyboard and touch users can clear the
         file without relying on hover/focus-within overlays. -->
    <button
      type="button"
      class="ml-12px shrink-0 w-32px h-32px flex items-center justify-center rounded-full bg-new.surface-muted transition-opacity hover:opacity-80 focus-visible:outline focus-visible:outline-2 focus-visible:outline-new.primary-400"
      (click)="file = null; deleteFile.emit()"
      aria-label="Remove file"
      >
      <svg width="16" height="16" class="fill-new.text-secondary">
        <use xlink:href="#delete-icon"></use>
      </svg>
    </button>
  </div>
}
