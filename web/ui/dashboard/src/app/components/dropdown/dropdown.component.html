@if (show) {
  <div convoyOverlay (click)="$event.stopPropagation(); show = false; close.emit()"></div>
}
<div class="relative">
  <div class="empty:hidden" #dropdownTriggerContainer>
    <ng-content select="[dropdownTrigger]"></ng-content>
  </div>

  <div convoy-dropdown-container #dropdownContainer [position]="position" [show]="show" [size]="size" [className]="className">
    <ng-content select="[dropdownOptions]"></ng-content>
  </div>
</div>
