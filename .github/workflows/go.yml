name: Build and run all tests
on:
    push:
        branches:
            - main
        tags:
            - 'v[0-9]+.[0-9]+.[0-9]+*'
    pull_request:

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: elenpay/ep-backend/convoy

jobs:
    test:
        if: ${{ !(contains(github.head_ref, 'ui/')) || !(contains(github.head_ref, 'cms/')) }}
        strategy:
            matrix:
                go-version: [1.25.x]
                os: [ubuntu-latest, macos-latest]
                postgres-version: ["15"]
                redis-version: ["6.2.6"]

        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:${{ matrix.postgres-version }}
                ports:
                    - 5432:5432
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_DB: convoy
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_MAX_CONNECTIONS: 2000
                    # set up health check for postgres
                options: --health-cmd pg_isready --health-interval 10ms --health-timeout 500ms --health-retries 15
        steps:
            - name: Start Redis v${{ matrix.redis-version }}
              uses: supercharge/redis-github-action@1.4.0
              with:
                  redis-version: ${{ matrix.redis-version }}
                  redis-port: 6379

            - name: Get the version
              id: get_version
              run: echo ::set-output name=tag::$(echo ${GITHUB_SHA:8})

            - name: Set up Go
              uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
              with:
                  go-version: ${{ matrix.go-version }}

            - name: Cache go modules
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
              with:
                  path: ~/go/pkg/mod
                  key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
                  restore-keys: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}

            - name: Check out code
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

            - name: Get and verify dependencies
              run: go mod download && go mod verify

            - name: Build app to make sure there are zero issues
              run: go build -o convoy ./cmd

            - name: Go vet
              run: go vet ./...

            - name: Migrate Postgres
              run: go run ./cmd migrate up
              env:
                  CONVOY_DB_SCHEME: postgres
                  CONVOY_DB_HOST: localhost
                  CONVOY_DB_USERNAME: postgres
                  CONVOY_DB_PASSWORD: postgres
                  CONVOY_DB_DATABASE: convoy
                  CONVOY_DB_OPTIONS: sslmode=disable&connect_timeout=30
                  CONVOY_DB_PORT: 5432
                  CONVOY_REDIS_SCHEME: redis
                  CONVOY_REDIS_HOST: localhost
                  CONVOY_REDIS_PORT: 6379

            - name: Run integration tests
              run: make integration_tests
              env:
                  TEST_DB_SCHEME: postgres
                  TEST_DB_HOST: localhost
                  TEST_DB_USERNAME: postgres
                  TEST_DB_PASSWORD: postgres
                  TEST_DB_DATABASE: convoy
                  TEST_DB_OPTIONS: sslmode=disable&connect_timeout=30
                  TEST_DB_PORT: 5432
                  TEST_REDIS_SCHEME: redis
                  TEST_REDIS_HOST: localhost
                  TEST_REDIS_PORT: 6379

    docker-build:
        needs: test
        if: startsWith(github.ref, 'refs/tags/')
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - name: Check out code
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

            - name: Set up Go
              uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
              with:
                  go-version: '1.25.x'

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log into the Container registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Docker meta
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=raw,value=latest
                  labels: |
                      commit=${{ github.sha }}
                      actions_run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            - name: Build UI
              run: |
                  cd web/ui/dashboard && npm ci && npm run build
                  mkdir -p api/ui/build
                  cp -r web/ui/dashboard/dist/* api/ui/build/

            - name: Build binary
              run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o convoy ./cmd

            - name: Build and push Docker image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: release.Dockerfile
                  push: true
                  platforms: linux/amd64
                  provenance: false
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
