# Regenerates docs/generated after every push to main. When outputs drift,
# convoy-docs-bot opens allowlisted sync PRs on convoy and convoy-website;
# convoy-docs-reviewer approves; the bot squash-merges.
#
# Secrets on frain-dev/convoy (caller): DOCS_BOT_APP_ID/KEY, DOCS_REVIEWER_APP_ID/KEY.
# Install both apps on frain-dev/convoy and frain-dev/convoy-website (selected).
# Same author/reviewer GitHub App pattern as the cloud staging bump bots.
#
# Failure policy: allowlist/author/base misses fail open to human review (comment +
# exit 0). Merge errors fail the job (loud CI) and leave the PR open. No PAT /
# repository_dispatch / GITHUB_TOKEN PR authorship.
name: Sync generated docs references

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-generated-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Convoy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6
        with:
          go-version: "1.26.2"

      - name: Regenerate reference artifacts
        run: |
          set -euo pipefail
          make docs-generated
          rm -rf /tmp/convoy-docs-generated
          mkdir -p /tmp/convoy-docs-generated
          cp -R docs/generated/. /tmp/convoy-docs-generated/

      - name: Mint convoy-docs-bot token (convoy)
        id: bot-convoy
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.DOCS_BOT_APP_ID }}
          private-key: ${{ secrets.DOCS_BOT_APP_KEY }}
          owner: frain-dev
          repositories: convoy

      - name: Open or update Convoy generated-docs PR
        id: convoy-pr
        env:
          GH_TOKEN: ${{ steps.bot-convoy.outputs.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          git config user.name "convoy-docs-bot[bot]"
          git config user.email "convoy-docs-bot[bot]@users.noreply.github.com"

          branch="chore/docs-generated-sync"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

          if git diff --quiet -- docs/generated/; then
            echo "No convoy docs/generated drift."
            echo "opened=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Force-push a tip derived from main + regenerated artifacts only.
          git fetch origin main
          git checkout -B "$branch" origin/main
          rm -rf docs/generated
          mkdir -p docs/generated
          cp -R /tmp/convoy-docs-generated/. docs/generated/
          git add docs/generated/
          if git diff --cached --quiet; then
            echo "No convoy docs/generated drift after rebase onto main."
            echo "opened=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          commit_msg="$(mktemp)"
          {
            echo "chore(docs): sync generated reference artifacts"
            echo ""
            echo "Regenerated by convoy-docs-bot after push ${SOURCE_SHA} to main."
          } >"$commit_msg"
          git commit -F "$commit_msg"
          rm -f "$commit_msg"

          git push --force -u origin "$branch"
          pushed_sha=$(git rev-parse HEAD)
          echo "pushed_sha=${pushed_sha}" >> "$GITHUB_OUTPUT"

          existing="$(gh pr list --repo frain-dev/convoy --head "$branch" --state open --json number,url -q '.[0] // empty' 2>/dev/null || true)"
          if [ -n "$existing" ]; then
            pr_num="$(echo "$existing" | jq -r .number)"
            pr_url="$(echo "$existing" | jq -r .url)"
            echo "Updated existing PR #${pr_num} for ${branch}."
          else
            pr_body="$(mktemp)"
            {
              echo "Automated sync: \`make docs-generated\` drifted after a push to \`main\`."
              echo ""
              echo "- **Source commit:** \`${SOURCE_SHA}\`"
              echo "- **Allowlist:** \`docs/generated/**\` only"
              echo ""
              echo "_Opened by convoy-docs-bot; approved and squash-merged by convoy-docs-reviewer + bot._"
            } >"$pr_body"
            pr_url="$(gh pr create \
              --repo frain-dev/convoy \
              --base main \
              --head "$branch" \
              --title "chore(docs): sync generated reference artifacts" \
              --body-file "$pr_body")"
            rm -f "$pr_body"
            pr_num="$(gh pr view "$pr_url" --repo frain-dev/convoy --json number -q .number)"
            echo "Opened ${pr_url}" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "pr_url=${pr_url}" >> "$GITHUB_OUTPUT"
          echo "pr_number=${pr_num}" >> "$GITHUB_OUTPUT"
          echo "opened=true" >> "$GITHUB_OUTPUT"

      - name: Mint convoy-docs-reviewer token (convoy)
        if: steps.convoy-pr.outputs.opened == 'true'
        id: reviewer-convoy
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.DOCS_REVIEWER_APP_ID }}
          private-key: ${{ secrets.DOCS_REVIEWER_APP_KEY }}
          owner: frain-dev
          repositories: convoy

      - name: Approve and squash-merge Convoy docs PR
        if: steps.convoy-pr.outputs.opened == 'true'
        env:
          APP_TOKEN: ${{ steps.reviewer-convoy.outputs.token }}
          MERGE_TOKEN: ${{ steps.bot-convoy.outputs.token }}
          PR: ${{ steps.convoy-pr.outputs.pr_number }}
          PUSHED_SHA: ${{ steps.convoy-pr.outputs.pushed_sha }}
          ALLOW_PREFIX: docs/generated/
        run: |
          set -euo pipefail
          GH_REPO=frain-dev/convoy
          pr="$PR"

          deny() {
            printf '%s\n' "$1" | GH_TOKEN="$APP_TOKEN" gh pr comment "$pr" --repo "$GH_REPO" --body-file - || true
            exit 0
          }

          pr_json=$(GH_TOKEN="$APP_TOKEN" gh pr view "$pr" --repo "$GH_REPO" \
            --json number,baseRefName,headRefOid,state)
          state=$(echo "$pr_json" | jq -r .state)
          if [ "$state" != "OPEN" ]; then
            echo "PR #$pr is $state; nothing to approve."
            exit 0
          fi

          base=$(echo "$pr_json" | jq -r .baseRefName)
          head_sha=$(echo "$pr_json" | jq -r .headRefOid)

          if [ "$base" != "main" ]; then
            deny "convoy-docs-reviewer: not auto-approving; base is \`$base\`, not \`main\`. Left for human review."
          fi

          author=$(GH_TOKEN="$APP_TOKEN" gh api "repos/$GH_REPO/pulls/$pr" --jq '.user.login')
          if [ "$author" != "convoy-docs-bot[bot]" ]; then
            deny "convoy-docs-reviewer: not auto-approving; author is \`$author\`, not convoy-docs-bot[bot]. Left for human review."
          fi

          if [ -z "${PUSHED_SHA:-}" ] || [ "$head_sha" != "$PUSHED_SHA" ]; then
            deny "convoy-docs-reviewer: not auto-approving; PR head \`$head_sha\` is not this run's push \`${PUSHED_SHA:-empty}\`. Left for human review."
          fi

          files=$(GH_TOKEN="$APP_TOKEN" gh api "repos/$GH_REPO/pulls/$pr/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)')
          if [ -z "$files" ]; then
            deny "convoy-docs-reviewer: not auto-approving; changed-files listing was empty. Left for human review."
          fi

          bad=$(printf '%s\n' "$files" \
            | while read -r f; do
                [ -z "$f" ] && continue
                case "$f" in
                  "${ALLOW_PREFIX}"*) ;;
                  *) echo "$f" ;;
                esac
              done)
          if [ -n "$bad" ]; then
            deny "$(printf '%s\n' \
              "convoy-docs-reviewer: not auto-approving; diff touches paths outside \`${ALLOW_PREFIX}\`:" \
              "" '```' "$bad" '```' "" \
              "Left for human review.")"
          fi

          already=$(GH_TOKEN="$APP_TOKEN" gh api "repos/$GH_REPO/pulls/$pr/reviews" --paginate \
            --jq '.[] | select(.user.login == "convoy-docs-reviewer[bot]" and .state == "APPROVED") | .commit_id' \
            | grep -cxF "$head_sha" || true)
          if [ "$already" = "0" ]; then
            review_id=$(GH_TOKEN="$APP_TOKEN" gh api -X POST "repos/$GH_REPO/pulls/$pr/reviews" \
              -f event=APPROVE \
              -f commit_id="$head_sha" \
              -f body="convoy-docs-reviewer: approving docs/generated-only sync by convoy-docs-bot." \
              --jq '.id')
            now_sha=$(GH_TOKEN="$APP_TOKEN" gh pr view "$pr" --repo "$GH_REPO" --json headRefOid --jq '.headRefOid')
            if [ "$now_sha" != "$head_sha" ]; then
              GH_TOKEN="$APP_TOKEN" gh api -X PUT "repos/$GH_REPO/pulls/$pr/reviews/$review_id/dismissals" \
                -f message="Head moved during approval; the approved commit is no longer the PR head." \
                -f event=DISMISS || true
              deny "convoy-docs-reviewer: approval dismissed; PR head changed during review. Left for human review."
            fi
          else
            echo "Reviewer already approved commit $head_sha; proceeding to merge."
          fi

          final_sha=$(GH_TOKEN="$APP_TOKEN" gh pr view "$pr" --repo "$GH_REPO" --json headRefOid --jq '.headRefOid')
          if [ "$final_sha" != "$PUSHED_SHA" ]; then
            deny "convoy-docs-reviewer: not merging; PR head moved to \`$final_sha\` after approval of \`$PUSHED_SHA\`. Left for human review."
          fi

          GH_TOKEN="$MERGE_TOKEN" gh pr merge "$pr" --repo "$GH_REPO" --squash --delete-branch
          echo "Approved and merged convoy PR #$pr" >> "$GITHUB_STEP_SUMMARY"

      - name: Mint convoy-docs-bot token (website)
        id: bot-website
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.DOCS_BOT_APP_ID }}
          private-key: ${{ secrets.DOCS_BOT_APP_KEY }}
          owner: frain-dev
          repositories: convoy-website

      - name: Sync generated docs into convoy-website
        id: website-pr
        env:
          GH_TOKEN: ${{ steps.bot-website.outputs.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          rm -rf /tmp/convoy-website
          git clone --depth 1 --branch main \
            "https://x-access-token:${GH_TOKEN}@github.com/frain-dev/convoy-website.git" \
            /tmp/convoy-website

          cd /tmp/convoy-website
          git config user.name "convoy-docs-bot[bot]"
          git config user.email "convoy-docs-bot[bot]@users.noreply.github.com"

          branch="chore/sync-convoy-generated-docs"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

          git checkout -B "$branch" origin/main
          rm -rf docs/generated/convoy
          mkdir -p docs/generated/convoy
          cp -R /tmp/convoy-docs-generated/. docs/generated/convoy/

          git add docs/generated/convoy/
          if git diff --cached --quiet; then
            echo "No website docs/generated/convoy drift."
            echo "opened=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          commit_msg="$(mktemp)"
          {
            echo "chore(docs): sync Convoy generated reference artifacts"
            echo ""
            echo "Mirrored from frain-dev/convoy at ${SOURCE_SHA} by convoy-docs-bot."
          } >"$commit_msg"
          git commit -F "$commit_msg"
          rm -f "$commit_msg"

          git push --force -u origin "$branch"
          pushed_sha=$(git rev-parse HEAD)
          echo "pushed_sha=${pushed_sha}" >> "$GITHUB_OUTPUT"

          existing="$(gh pr list --repo frain-dev/convoy-website --head "$branch" --state open --json number,url -q '.[0] // empty' 2>/dev/null || true)"
          if [ -n "$existing" ]; then
            pr_num="$(echo "$existing" | jq -r .number)"
            pr_url="$(echo "$existing" | jq -r .url)"
            echo "Updated existing website PR #${pr_num}."
          else
            pr_body="$(mktemp)"
            {
              echo "Automated sync of \`docs/generated/convoy/\` from \`frain-dev/convoy\`."
              echo ""
              echo "- **Convoy commit:** \`${SOURCE_SHA}\`"
              echo "- **Allowlist:** \`docs/generated/convoy/**\` only"
              echo ""
              echo "_Opened by convoy-docs-bot; approved and squash-merged by convoy-docs-reviewer + bot._"
            } >"$pr_body"
            pr_url="$(gh pr create \
              --repo frain-dev/convoy-website \
              --base main \
              --head "$branch" \
              --title "chore(docs): sync Convoy generated reference artifacts" \
              --body-file "$pr_body")"
            rm -f "$pr_body"
            pr_num="$(gh pr view "$pr_url" --repo frain-dev/convoy-website --json number -q .number)"
            echo "Opened ${pr_url}" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "pr_url=${pr_url}" >> "$GITHUB_OUTPUT"
          echo "pr_number=${pr_num}" >> "$GITHUB_OUTPUT"
          echo "opened=true" >> "$GITHUB_OUTPUT"

      - name: Mint convoy-docs-reviewer token (website)
        if: steps.website-pr.outputs.opened == 'true'
        id: reviewer-website
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.DOCS_REVIEWER_APP_ID }}
          private-key: ${{ secrets.DOCS_REVIEWER_APP_KEY }}
          owner: frain-dev
          repositories: convoy-website

      - name: Approve and squash-merge website docs PR
        if: steps.website-pr.outputs.opened == 'true'
        env:
          APP_TOKEN: ${{ steps.reviewer-website.outputs.token }}
          MERGE_TOKEN: ${{ steps.bot-website.outputs.token }}
          PR: ${{ steps.website-pr.outputs.pr_number }}
          PUSHED_SHA: ${{ steps.website-pr.outputs.pushed_sha }}
          ALLOW_PREFIX: docs/generated/convoy/
        run: |
          set -euo pipefail
          GH_REPO=frain-dev/convoy-website
          pr="$PR"

          deny() {
            printf '%s\n' "$1" | GH_TOKEN="$APP_TOKEN" gh pr comment "$pr" --repo "$GH_REPO" --body-file - || true
            exit 0
          }

          pr_json=$(GH_TOKEN="$APP_TOKEN" gh pr view "$pr" --repo "$GH_REPO" \
            --json number,baseRefName,headRefOid,state)
          state=$(echo "$pr_json" | jq -r .state)
          if [ "$state" != "OPEN" ]; then
            echo "PR #$pr is $state; nothing to approve."
            exit 0
          fi

          base=$(echo "$pr_json" | jq -r .baseRefName)
          head_sha=$(echo "$pr_json" | jq -r .headRefOid)

          if [ "$base" != "main" ]; then
            deny "convoy-docs-reviewer: not auto-approving; base is \`$base\`, not \`main\`. Left for human review."
          fi

          author=$(GH_TOKEN="$APP_TOKEN" gh api "repos/$GH_REPO/pulls/$pr" --jq '.user.login')
          if [ "$author" != "convoy-docs-bot[bot]" ]; then
            deny "convoy-docs-reviewer: not auto-approving; author is \`$author\`, not convoy-docs-bot[bot]. Left for human review."
          fi

          if [ -z "${PUSHED_SHA:-}" ] || [ "$head_sha" != "$PUSHED_SHA" ]; then
            deny "convoy-docs-reviewer: not auto-approving; PR head \`$head_sha\` is not this run's push \`${PUSHED_SHA:-empty}\`. Left for human review."
          fi

          files=$(GH_TOKEN="$APP_TOKEN" gh api "repos/$GH_REPO/pulls/$pr/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)')
          if [ -z "$files" ]; then
            deny "convoy-docs-reviewer: not auto-approving; changed-files listing was empty. Left for human review."
          fi

          bad=$(printf '%s\n' "$files" \
            | while read -r f; do
                [ -z "$f" ] && continue
                case "$f" in
                  "${ALLOW_PREFIX}"*) ;;
                  *) echo "$f" ;;
                esac
              done)
          if [ -n "$bad" ]; then
            deny "$(printf '%s\n' \
              "convoy-docs-reviewer: not auto-approving; diff touches paths outside \`${ALLOW_PREFIX}\`:" \
              "" '```' "$bad" '```' "" \
              "Left for human review.")"
          fi

          already=$(GH_TOKEN="$APP_TOKEN" gh api "repos/$GH_REPO/pulls/$pr/reviews" --paginate \
            --jq '.[] | select(.user.login == "convoy-docs-reviewer[bot]" and .state == "APPROVED") | .commit_id' \
            | grep -cxF "$head_sha" || true)
          if [ "$already" = "0" ]; then
            review_id=$(GH_TOKEN="$APP_TOKEN" gh api -X POST "repos/$GH_REPO/pulls/$pr/reviews" \
              -f event=APPROVE \
              -f commit_id="$head_sha" \
              -f body="convoy-docs-reviewer: approving docs/generated/convoy-only sync by convoy-docs-bot." \
              --jq '.id')
            now_sha=$(GH_TOKEN="$APP_TOKEN" gh pr view "$pr" --repo "$GH_REPO" --json headRefOid --jq '.headRefOid')
            if [ "$now_sha" != "$head_sha" ]; then
              GH_TOKEN="$APP_TOKEN" gh api -X PUT "repos/$GH_REPO/pulls/$pr/reviews/$review_id/dismissals" \
                -f message="Head moved during approval; the approved commit is no longer the PR head." \
                -f event=DISMISS || true
              deny "convoy-docs-reviewer: approval dismissed; PR head changed during review. Left for human review."
            fi
          else
            echo "Reviewer already approved commit $head_sha; proceeding to merge."
          fi

          final_sha=$(GH_TOKEN="$APP_TOKEN" gh pr view "$pr" --repo "$GH_REPO" --json headRefOid --jq '.headRefOid')
          if [ "$final_sha" != "$PUSHED_SHA" ]; then
            deny "convoy-docs-reviewer: not merging; PR head moved to \`$final_sha\` after approval of \`$PUSHED_SHA\`. Left for human review."
          fi

          GH_TOKEN="$MERGE_TOKEN" gh pr merge "$pr" --repo "$GH_REPO" --squash --delete-branch
          echo "Approved and merged website PR #$pr" >> "$GITHUB_STEP_SUMMARY"
